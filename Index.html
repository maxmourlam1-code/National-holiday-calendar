
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>National Holiday Calendar</title>
<style>
* { box-sizing: border-box; }
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #f0f6ff;
  color: #172b4d;
}
header {
  background: #1769e0;
  color: white;
  text-align: center;
  padding: 25px 15px;
}
header h1 { margin: 0 0 8px; }
main { max-width: 850px; margin: auto; padding: 20px; }
input, textarea, button {
  font: inherit;
  padding: 12px;
  border-radius: 10px;
  border: 1px solid #ccd6e5;
}
input, textarea { width: 100%; margin: 6px 0; }
button {
  cursor: pointer;
  border: none;
  background: #1769e0;
  color: white;
  margin: 5px 3px;
}
button:hover { opacity: .85; }
.card {
  background: white;
  padding: 18px;
  margin: 15px 0;
  border-radius: 15px;
  box-shadow: 0 3px 12px #00000012;
}
.card img {
  width: 100%;
  max-height: 250px;
  object-fit: cover;
  border-radius: 10px;
  margin-top: 10px;
}
.date { color: #1769e0; font-weight: bold; }
.actions { margin-top: 10px; }
.actions button { background: #e7efff; color: #172b4d; }
form { display: none; }
form.show { display: block; }
h2 { margin-top: 10px; }
.comment {
  background: #f0f4fa;
  padding: 8px;
  border-radius: 8px;
  margin-top: 5px;
}
small { color: #63748a; }
</style>
</head>

<body>
<header>
  <h1>🎉 National Holiday Calendar</h1>
  <p>Discover holidays. Create your own. Celebrate together!</p>
</header>

<main>
  <input id="search" placeholder="🔍 Search holidays..."
         oninput="displayHolidays()">

  <button onclick="toggleForm()">➕ Create a Holiday</button>

  <button onclick="toggleNotifications()">
    🔔 Notifications
  </button>

  <p id="notificationStatus"></p>

  <form id="holidayForm" class="card" onsubmit="createHoliday(event)">
    <h2>Create Your Holiday</h2>

    <label>Holiday name</label>
    <input id="holidayName" required placeholder="Example: Cat Day">

    <label>Date</label>
    <input id="holidayDate" type="date" required>

    <label>Description</label>
    <textarea id="holidayDescription"
      placeholder="What is this holiday about?"></textarea>

    <label>Photo URL (optional)</label>
    <input id="holidayPhoto" type="url"
      placeholder="https://example.com/photo.jpg">

    <button type="submit">🎊 Publish Holiday</button>
    <button type="button" onclick="toggleForm()">Cancel</button>
  </form>

  <h2>📅 All Holidays</h2>
  <div id="holidayList"></div>
</main>

<script>
const starterHolidays = [
  {
    id: 1,
    name: "New Year's Day",
    date: "2027-01-01",
    description: "Celebrate the beginning of a new year!",
    photo: "",
    likes: 0,
    dislikes: 0,
    comments: []
  },
  {
    id: 2,
    name: "International Cat Day",
    date: "2027-08-08",
    description: "A day to celebrate cats everywhere! 🐱",
    photo: "",
    likes: 0,
    dislikes: 0,
    comments: []
  }
];

let holidays = JSON.parse(
  localStorage.getItem("myHolidays")
) || starterHolidays;

let notificationsEnabled =
  localStorage.getItem("notifications") === "true";

function save() {
  localStorage.setItem("myHolidays", JSON.stringify(holidays));
}

function escapeHTML(text) {
  return String(text).replace(/[&<>"']/g, function(c) {
    return {
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    }[c];
  });
}

function toggleForm() {
  document.getElementById("holidayForm").classList.toggle("show");
}

function toggleNotifications() {
  notificationsEnabled = !notificationsEnabled;
  localStorage.setItem("notifications", notificationsEnabled);
  updateNotificationStatus();
}

function updateNotificationStatus() {
  document.getElementById("notificationStatus").textContent =
    notificationsEnabled
    ? "🔔 Notifications are turned on for this browser."
    : "🔕 Notifications are turned off.";
}

function createHoliday(event) {
  event.preventDefault();

  const newHoliday = {
    id: Date.now(),
    name: document.getElementById("holidayName").value,
    date: document.getElementById("holidayDate").value,
    description: document.getElementById("holidayDescription").value,
    photo: document.getElementById("holidayPhoto").value,
    likes: 0,
    dislikes: 0,
    comments: []
  };

  holidays.push(newHoliday);
  save();

  document.getElementById("holidayForm").reset();
  document.getElementById("holidayForm").classList.remove("show");

  displayHolidays();
  alert("🎉 Your holiday was created!");
}

function likeHoliday(id) {
  const holiday = holidays.find(h => h.id === id);
  if (holiday) holiday.likes++;
  save();
  displayHolidays();
}

function dislikeHoliday(id) {
  const holiday = holidays.find(h => h.id === id);
  if (holiday) holiday.dislikes++;
  save();
  displayHolidays();
}

function addComment(id) {
  const input = document.getElementById("comment-" + id);
  const text = input.value.trim();

  if (!text) return;

  const holiday = holidays.find(h => h.id === id);
  if (holiday) holiday.comments.push(text);

  input.value = "";
  save();
  displayHolidays();
}

function displayHolidays() {
  const search = document.getElementById("search").value.toLowerCase();
  const list = document.getElementById("holidayList");

  const results = holidays
    .filter(h =>
      h.name.toLowerCase().includes(search) ||
      h.description.toLowerCase().includes(search)
    )
    .sort((a, b) => a.date.localeCompare(b.date));

  if (results.length === 0) {
    list.innerHTML = "<p>No holidays found. Try another search!</p>";
    return;
  }

  list.innerHTML = results.map(h => `
    <div class="card">
      <h2>🎊 ${escapeHTML(h.name)}</h2>
      <p class="date">📅 ${escapeHTML(h.date)}</p>
      <p>${escapeHTML(h.description)}</p>
      ${h.photo ? `<img src="${escapeHTML(h.photo)}"
        alt="Photo for ${escapeHTML(h.name)}"
        onerror="this.style.display='none'">` : ""}
      <div class="actions">
        <button onclick="likeHoliday(${h.id})">
          ❤️ Like ${h.likes}
        </button>
        <button onclick="dislikeHoliday(${h.id})">
          👎 Dislike ${h.dislikes}
        </button>
      </div>
      <h3>💬 Comments</h3>
      ${h.comments.map(c =>
        `<div class="comment">${escapeHTML(c)}</div>`
      ).join("")}
      <input id="comment-${h.id}"
        placeholder="Write a comment...">
      <button onclick="addComment(${h.id})">
        Post Comment
      </button>
    </div>
  `).join("");
}

updateNotificationStatus();
displayHolidays();
</script>
</body>
 </html>
