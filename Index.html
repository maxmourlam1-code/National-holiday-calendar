
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>National Holiday Calendar</title>
<style>
* { box-sizing: border-box; }
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #f0f4ff;
  color: #222;
}
header {
  background: #4267b2;
  color: white;
  padding: 20px;
  text-align: center;
}
header h1 { margin: 0 0 8px; }
.container {
  max-width: 900px;
  margin: auto;
  padding: 15px;
}
.card {
  background: white;
  padding: 18px;
  border-radius: 15px;
  margin: 15px 0;
  box-shadow: 0 2px 8px #0001;
}
input, textarea, button {
  font: inherit;
  padding: 10px;
  margin: 5px 0;
  border-radius: 8px;
  border: 1px solid #ccc;
}
input, textarea { width: 100%; }
button {
  background: #4267b2;
  color: white;
  border: none;
  cursor: pointer;
}
button:hover { background: #294c91; }
.holiday {
  border: 1px solid #ddd;
  border-radius: 12px;
  padding: 15px;
  margin-top: 12px;
}
.holiday img {
  width: 100%;
  max-height: 250px;
  object-fit: cover;
  border-radius: 10px;
}
.actions button {
  margin-right: 5px;
  background: #eee;
  color: #222;
}
.comment {
  background: #f4f4f4;
  padding: 8px;
  border-radius: 8px;
  margin-top: 5px;
}
.small { color: #666; font-size: 14px; }
.hidden { display: none; }
</style>
</head>
<body>

<header>
<h1>🗓️ National Holiday Calendar</h1>
<p>Create, discover, and celebrate holidays!</p>
</header>

<div class="container">

<div class="card">
<h2>🔎 Search Holidays</h2>
<input id="search" placeholder="Search holidays..." oninput="displayHolidays()">
</div>

<div class="card">
<h2>➕ Create Your Own Holiday</h2>
<input id="holidayName" placeholder="Holiday name">
<input id="holidayDate" type="date">
<textarea id="holidayDescription" placeholder="Describe your holiday..."></textarea>
<input id="holidayImage" placeholder="Photo URL (optional)">
<button onclick="createHoliday()">Create Holiday 🎉</button>
<p id="message"></p>
</div>

<div class="card">
<h2>🔔 Notifications</h2>
<label>
<input type="checkbox" id="notifications" style="width:auto">
 Allow notification reminders
</label>
<p class="small">This saves your preference on this device.</p>
</div>

<div class="card">
<h2>🌎 All Holidays</h2>
<div id="holidayList"></div>
</div>

</div>

<script>
let holidays = JSON.parse(
  localStorage.getItem("holidays") || "[]"
);

if (holidays.length === 0) {
  holidays = [
    {
      id: 1,
      name: "National Pizza Day 🍕",
      date: "2026-02-09",
      description: "A day to celebrate delicious pizza!",
      image: "",
      likes: 0,
      dislikes: 0,
      comments: []
    },
    {
      id: 2,
      name: "International Cat Day 🐱",
      date: "2026-08-08",
      description: "Celebrate cats everywhere!",
      image: "",
      likes: 0,
      dislikes: 0,
      comments: []
    }
  ];
  saveHolidays();
}

function saveHolidays() {
  localStorage.setItem("holidays", JSON.stringify(holidays));
}

function createHoliday() {
  const name = document.getElementById("holidayName").value.trim();
  const date = document.getElementById("holidayDate").value;
  const description = document.getElementById("holidayDescription").value.trim();
  const image = document.getElementById("holidayImage").value.trim();
  const message = document.getElementById("message");

  if (!name || !date) {
    message.textContent = "Please enter a name and date.";
    return;
  }

  holidays.push({
    id: Date.now(),
    name: name,
    date: date,
    description: description,
    image: image,
    likes: 0,
    dislikes: 0,
    comments: []
  });

  saveHolidays();

  document.getElementById("holidayName").value = "";
  document.getElementById("holidayDate").value = "";
  document.getElementById("holidayDescription").value = "";
  document.getElementById("holidayImage").value = "";

  message.textContent = "🎉 Holiday created!";
  displayHolidays();
}

function displayHolidays() {
  const list = document.getElementById("holidayList");
  const search = document.getElementById("search").value.toLowerCase();

  const filtered = holidays.filter(h =>
    h.name.toLowerCase().includes(search) ||
    h.description.toLowerCase().includes(search)
  );

  if (filtered.length === 0) {
    list.innerHTML = "<p>No holidays found.</p>";
    return;
  }

  list.innerHTML = filtered.map(h => `
    <div class="holiday">
      <h3>${escapeHTML(h.name)}</h3>
      <p>📅 ${escapeHTML(h.date)}</p>
      <p>${escapeHTML(h.description)}</p>

      ${h.image ? `<img src="${escapeHTML(h.image)}" alt="Holiday photo" onerror="this.style.display='none'">` : ""}

      <div class="actions">
        <button onclick="likeHoliday(${h.id})">
          👍 Like (${h.likes})
        </button>
        <button onclick="dislikeHoliday(${h.id})">
          👎 Dislike (${h.dislikes})
        </button>
      </div>

      <h4>💬 Comments</h4>
      <div>
        ${h.comments.map(c => `
          <div class="comment">${escapeHTML(c)}</div>
        `).join("")}
      </div>

      <input id="comment-${h.id}" placeholder="Write a comment...">
      <button onclick="addComment(${h.id})">Post Comment</button>
    </div>
  `).join("");
}

function likeHoliday(id) {
  const h = holidays.find(h => h.id === id);
  if (h) h.likes++;
  saveHolidays();
  displayHolidays();
}

function dislikeHoliday(id) {
  const h = holidays.find(h => h.id === id);
  if (h) h.dislikes++;
  saveHolidays();
  displayHolidays();
}

function addComment(id) {
  const input = document.getElementById("comment-" + id);
  const text = input.value.trim();

  if (!text) return;

  const h = holidays.find(h => h.id === id);
  if (h) h.comments.push(text);

  saveHolidays();
  displayHolidays();
}

function escapeHTML(text) {
  return String(text).replace(/[&<>"']/g, c => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[c]));
}

document.getElementById("notifications").checked =
  localStorage.getItem("notifications") === "true";

document.getElementById("notifications").addEventListener("change", e => {
  localStorage.setItem("notifications", e.target.checked);
});

displayHolidays();
</script>

</body>
</html>
